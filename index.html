<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Outage Database Manager</title>
<style>
  @import url('https://cdnjs.cloudflare.com/ajax/libs/JetBrains-Mono/2.304/jetbrains-mono.min.css');

  :root{
    --bg:#0B1712;
    --surface:#12241C;
    --surface-2:#182F25;
    --line:#25422F;
    --amber:#D9A441;
    --amber-dim:#8C7133;
    --green:#4CAF6D;
    --blue:#5B9BD5;
    --red:#C4634A;
    --text:#EAEDE7;
    --muted:#8FA396;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:14px;
    display:flex; height:100vh; overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:200px; background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; flex-shrink:0;
  }
  .brand{ padding:20px 18px 14px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .reload-btn{
    background:none; border:1px solid var(--line); color:var(--muted); border-radius:50%;
    width:28px; height:28px; flex:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:border-color .15s ease, color .15s ease, transform .4s ease;
  }
  .reload-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .reload-btn svg{ width:14px; height:14px; }
  .reload-btn.spinning svg{ animation:spin .6s linear; }
  .run-builder-btn{
    margin:10px 14px 12px; padding:9px 10px; background:rgba(217,164,65,.12); border:1px solid rgba(217,164,65,.4);
    color:var(--amber); border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .run-builder-btn:hover{ background:rgba(217,164,65,.2); }
  .run-builder-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .run-builder-btn svg{ width:14px; height:14px; flex:none; }
  .run-builder-btn.spinning svg{ animation:spin 1s linear infinite; }
  @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .brand .name{ font-weight:600; font-size:15px; letter-spacing:.2px; }
  .brand .sub{ color:var(--muted); font-size:11.5px; margin-top:2px; }
  .nav{ padding:10px; display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav button{
    all:unset; cursor:pointer; padding:10px 12px; border-radius:6px;
    color:var(--muted); font-size:13.5px; display:flex; justify-content:space-between; align-items:center;
  }
  .nav button:hover{ background:var(--surface-2); color:var(--text); }
  .nav button.active{ background:var(--surface-2); color:var(--amber); }
  .nav .count{
    font-family:var(--mono); font-size:11px; background:var(--bg);
    padding:1px 6px; border-radius:10px; color:var(--muted);
  }
  .nav button.active .count{ color:var(--amber); }
  .nav .count.status-all{ background:rgba(91,155,213,.15); color:var(--blue); }
  .nav .count.status-ongoing{ background:rgba(217,164,65,.15); color:var(--amber); }
  .nav .count.status-restored{ background:rgba(76,175,109,.15); color:var(--green); }
  .nav button.active .count.status-all{ color:var(--blue); }
  .nav button.active .count.status-ongoing{ color:var(--amber); }
  .nav button.active .count.status-restored{ color:var(--green); }
  .conn{ padding:14px 16px; border-top:1px solid var(--line); font-size:11.5px; }
  .last-refreshed{ color:var(--muted); font-size:10.5px; margin-left:4px; }
  .conn .dot{
    width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px;
    background:var(--muted);
  }
  .conn.live .dot{ background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse 2s infinite; }
  .conn.error .dot{ background:var(--red); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .conn a{ color:var(--amber); cursor:pointer; text-decoration:none; }
  .ext-links{ display:flex; gap:8px; padding:0 16px 10px; }
  .ext-links a{
    flex:1; text-align:center; padding:7px 8px; border:1px solid var(--line); border-radius:6px;
    color:var(--muted); font-size:11px; text-decoration:none; transition:border-color .15s ease, color .15s ease;
  }
  .ext-links a:hover{ border-color:var(--amber); color:var(--amber); }
  .pagination{ display:flex; align-items:center; justify-content:center; gap:14px; padding:16px; }
  .page-indicator{ font-size:12px; color:var(--muted); }
  .ongoing-days{ font-size:10px; color:var(--muted); margin-left:5px; }
  .ongoing-days.stale{ color:var(--red); font-weight:600; }

  /* ---------- Main ---------- */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar{
    padding:16px 24px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .topbar h1{ font-size:17px; margin:0; font-weight:600; }
  .topbar .meta{ color:var(--muted); font-size:12.5px; margin-top:2px; }
  .actions{ display:flex; gap:8px; }
  .btn{
    all:unset; cursor:pointer; padding:8px 14px; border-radius:6px; font-size:13px;
    font-weight:500; border:1px solid var(--line);
  }
  .btn:hover{ border-color:var(--amber-dim); }
  .btn.primary{ background:var(--amber); color:#1A1204; border-color:var(--amber); }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{ border-color:transparent; color:var(--muted); }
  .btn.ghost:hover{ color:var(--text); }
  .btn.danger{ color:var(--red); }

  .toolbar{ padding:12px 24px; display:flex; gap:10px; border-bottom:1px solid var(--line); }
  .toolbar input, .toolbar select{
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:7px 10px; border-radius:6px; font-size:13px; font-family:var(--sans);
  }
  .toolbar input{ flex:1; max-width:280px; }
  .search-wrap{ position:relative; flex:1; max-width:280px; }
  .search-wrap input{ max-width:none; width:100%; padding-right:28px; }
  .search-clear{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); font-size:16px; line-height:1;
    width:20px; height:20px; border-radius:4px; cursor:pointer; display:none;
    align-items:center; justify-content:center;
  }
  .search-clear:hover{ color:var(--amber); background:rgba(255,255,255,.06); }
  .search-wrap.has-text .search-clear{ display:flex; }

  .content{ flex:1; overflow:auto; padding:0 24px 24px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{
    text-align:left; padding:10px 12px; color:var(--muted); font-weight:500;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg);
    white-space:nowrap;
  }
  tbody td{ padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:hover{ background:var(--surface); }
  .mono{ font-family:var(--mono); font-size:12.5px; }
  .editable{ cursor:text; border-radius:4px; }
  .editable:hover{ background:var(--surface-2); }
  .editable input, .editable select{
    width:100%; background:var(--surface-2); border:1px solid var(--amber-dim);
    color:var(--text); padding:4px 6px; border-radius:4px; font-size:12.5px; font-family:inherit;
  }
  .badge{
    display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:500;
  }
  .badge.restored{ background:rgba(76,175,109,.15); color:var(--green); }
  .badge.ongoing{ background:rgba(217,164,65,.15); color:var(--amber); }
  .badge.review{ background:rgba(196,99,74,.15); color:var(--red); }
  .badge.planned{ background:rgba(143,163,150,.15); color:var(--muted); }
  .badge.unplanned{ background:rgba(217,164,65,.15); color:var(--amber); }
  .resid-ongoing{ background:rgba(255,214,51,.22); color:#FFE066; font-weight:600; }
  .resid-ongoing:hover{ background:rgba(255,214,51,.32); }
  .resid-restored{ background:rgba(76,175,109,.22); color:#8FE0AA; font-weight:600; }
  .resid-restored:hover{ background:rgba(76,175,109,.32); }
  .copy-btn{
    background:none; border:1px solid var(--line); color:var(--muted); border-radius:5px;
    width:20px; height:20px; padding:0; flex:none; display:inline-flex; align-items:center;
    justify-content:center; cursor:pointer; opacity:.5; transition:opacity .15s ease, border-color .15s ease, color .15s ease;
  }
  .copy-btn:hover{ opacity:1; border-color:var(--amber); color:var(--amber); }
  .copy-btn svg{ width:11px; height:11px; }
  .copy-table-wrap{ max-height:340px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; margin-bottom:16px; }
  .copy-preview-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .copy-preview-table th{
    position:sticky; top:0; background:var(--surface); text-align:left; padding:7px 12px;
    color:var(--muted); font-weight:600; border-bottom:1px solid var(--line);
  }
  .copy-preview-table td{ padding:5px 12px; border-bottom:1px solid var(--line); }

  .derated-date-label{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);
  }
  .date-input-wrap{ position:relative; display:inline-flex; align-items:center; }
  .date-input-wrap input[type="date"]{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:6px 34px 6px 10px; border-radius:6px; font-size:13px; font-family:var(--sans);
  }
  .date-input-wrap input[type="date"]::-webkit-calendar-picker-indicator{
    opacity:0; position:absolute; right:0; top:0; width:100%; height:100%; margin:0; cursor:pointer;
  }
  .date-input-icon{
    position:absolute; right:9px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; color:var(--amber); pointer-events:none; transition:transform .15s ease;
  }
  .date-input-wrap:hover .date-input-icon{ transform:translateY(-50%) scale(1.1); }
  .derated-wrap{ padding:20px 24px; display:flex; flex-direction:column; gap:22px; }
  .derated-section-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .derated-section-header h3{
    margin:0; font-size:13px; letter-spacing:.04em; color:var(--muted); font-weight:700;
  }
  .copy-btn-text{
    background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px;
    padding:5px 12px; font-size:12px; cursor:pointer; transition:border-color .15s ease, color .15s ease;
  }
  .copy-btn-text:hover{ border-color:var(--amber); color:var(--amber); }
  .derated-table{ width:100%; border-collapse:collapse; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .derated-table th{
    text-align:left; padding:8px 14px; background:rgba(255,255,255,.03); color:var(--muted);
    font-size:12px; font-weight:600; border-bottom:1px solid var(--line);
  }
  .derated-table td{ padding:8px 14px; font-size:13px; border-bottom:1px solid var(--line); }
  .derated-table tr:last-child td{ border-bottom:none; }
  .derated-table td.mono{ width:110px; white-space:nowrap; }
  th.sortable{ cursor:pointer; user-select:none; }
  th.sortable:hover{ color:var(--text); }
  .sort-arrow{ margin-left:4px; color:var(--amber); font-size:10px; }
  .loading-bar{
    position:fixed; top:0; left:0; width:100%; height:2px; overflow:hidden;
    z-index:200; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .loading-bar.active{ opacity:1; }
  .loading-bar span{
    display:block; height:100%; width:30%; background:var(--amber);
    animation:loadingSlide 1s ease-in-out infinite;
  }
  @keyframes loadingSlide{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(400%); }
  }
  .msg-cell{ max-width:340px; color:var(--muted); font-size:12px; line-height:1.4; }
  .empty{ text-align:center; padding:60px 20px; color:var(--muted); }
  .empty .big{ font-size:15px; color:var(--text); margin-bottom:6px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
    align-items:center; justify-content:center; z-index:50;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    width:520px; max-width:92vw; max-height:86vh; overflow:auto; padding:22px 24px;
  }
  .modal h2{ margin:0 0 4px; font-size:16px; cursor:grab; user-select:none; }
  .modal h2:active{ cursor:grabbing; }
  .modal h2::before{ content:'⠿  '; opacity:.35; letter-spacing:-2px; }
  .modal .desc{ color:var(--muted); font-size:12.5px; margin-bottom:16px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .checkbox-field{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .checkbox-field input[type="checkbox"]{ width:15px; height:15px; accent-color:var(--amber); cursor:pointer; }
  .checkbox-field label{ margin:0; font-size:13px; color:var(--text); cursor:pointer; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:6px; font-size:13px; font-family:var(--sans);
  }
  .field textarea{ font-family:var(--mono); font-size:12px; resize:vertical; min-height:60px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .quote-box{
    background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px 12px;
    font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-bottom:14px; line-height:1.5;
  }
  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--surface-2); border:1px solid var(--line);
    padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transform:translateY(8px);
    transition:all .25s; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast.error{ border-color:var(--red); color:var(--red); }
  .toast.success{ border-color:var(--green); color:var(--green); }
</style>
</head>
<body>

<div class="loading-bar" id="loadingBar"><span></span></div>

<div class="sidebar">
  <div class="brand">
    <div>
      <div class="name">Outage Database</div>
      <div class="sub">ABICorp · WESM Trading</div>
    </div>
    <button class="reload-btn" id="reloadBtn" title="Refresh data" onclick="manualRefresh()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"></path>
        <path d="M1 20v-6h6"></path>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    </button>
  </div>
  <button class="run-builder-btn" id="runBuilderBtn" title="Process new SO_Advisories into Outage Database" onclick="runBuilder()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
    Run Builder
  </button>
  <div class="nav">
    <button data-view="outages" class="active">Outages <span class="count" id="countOutages">–</span></button>
    <button data-view="plants">Plant Mapping <span class="count" id="countPlants">–</span></button>
    <button data-view="review">Needs Review <span class="count" id="countReview">–</span></button>
    <button data-view="derated">Derated Plants</button>
  </div>
  <div class="ext-links">
    <a href="https://colab.research.google.com/drive/1eNK3qEonWs6-YUJgJyZwgDjKbuilmUYR#scrollTo=z4nhI3pzeq2D" target="_blank" rel="noopener">SO Extractor</a>
    <a href="https://docs.google.com/spreadsheets/d/1g9ov9yH4QARlaqeSw2WrK7QWuxXSzBYzIVNXsCDlMpU/edit?usp=sharing" target="_blank" rel="noopener">DB Sheets</a>
  </div>
  <div class="conn" id="connStatus">
    <span class="dot"></span><span id="connText">Not connected</span>
    <span id="lastRefreshedText" class="last-refreshed"></span><br>
    <a id="settingsLink">Set Web App URL</a>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <h1 id="viewTitle">Outage Database</h1>
      <div class="meta" id="viewMeta">One row per outage instance</div>
    </div>
    <div class="actions" id="viewActions"></div>
  </div>
  <div class="toolbar" id="toolbar">
    <div class="search-wrap">
      <input type="text" id="searchBox" placeholder="Search plant, resource ID, message…">
      <button class="search-clear" id="searchClear" title="Clear search" onclick="clearSearch()">×</button>
    </div>
    <select id="filterSelect"></select>
  </div>
  <div class="content" id="content">
    <div class="empty">
      <div class="big">Not connected yet</div>
      Click "Set Web App URL" in the sidebar to connect to your Google Sheet.
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
let WEBAPP_URL = '';
// Falls back to this deployment if nothing's saved yet for this browser —
// change this if you ever create a new Apps Script deployment.
const DEFAULT_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxgNWfUXzYMk8FnlGeCE0QTZJjuvtWCBF4jLcOhcFjQ3QsY5oAh6dNcskWGuZWublIi/exec';
let currentView = 'outages';
let dataCache = { outages: [], plants: [], review: [], technology: {}, derated: null };
let technologyByUpper = {};
let searchTerm = '';
let filterValue = '';
let sortState = {
  outages: { field:null, dir:'desc' },
  plants:  { field:null, dir:'asc'  },
  review:  { field:null, dir:'asc' }
};
let lastRefreshedAt = null;

const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);

// ---------- persisted settings ----------
async function loadSettings(){
  try{
    const saved = localStorage.getItem('outageManagerWebAppUrl');
    WEBAPP_URL = saved || DEFAULT_WEBAPP_URL;
    setConnStatus('checking', 'Connecting…');
    await refreshAll();
  }catch(e){ console.warn('Could not read saved URL:', e); }
}
async function saveUrl(url){
  WEBAPP_URL = url.trim();
  try{ localStorage.setItem('outageManagerWebAppUrl', WEBAPP_URL); }
  catch(e){ console.warn('Could not persist URL (will need to re-enter next time):', e); }
}

function setConnStatus(state, label){
  const el = $('#connStatus');
  el.className = 'conn ' + (state === 'live' ? 'live' : state === 'error' ? 'error' : '');
  $('#connText').textContent = label || (state === 'live' ? 'Connected' : state === 'error' ? 'Connection error' : 'Not connected');
}

$('#settingsLink').onclick = () => openUrlModal();

function openUrlModal(){
  $('#modalBody').innerHTML = `
    <h2>Web App URL</h2>
    <div class="desc">Paste the /exec URL from your Apps Script deployment (Deploy → Manage deployments).</div>
    <div class="field"><input id="urlInput" placeholder="https://script.google.com/macros/s/.../exec" value="${WEBAPP_URL}"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="connectUrl()">Connect</button>
    </div>`;
  $('#overlay').classList.add('show');
}
async function connectUrl(){
  const url = $('#urlInput').value.trim();
  if(!url){ toast('Enter a URL', 'error'); return; }
  try{
    await saveUrl(url);
    closeModal();
    setConnStatus('checking', 'Connecting…');
    await refreshAll();
  }catch(e){
    toast('Connect failed: ' + e.message, 'error');
    console.error(e);
  }
}
function closeModal(){
  $('#overlay').classList.remove('show');
  const modal = $('#modalBody');
  modal.style.position = '';
  modal.style.left = '';
  modal.style.top = '';
  modal.style.margin = '';
}
// Click-outside-to-close was removed: it conflicted with native date/time
// pickers (a picker dismissal click landing on the backdrop would close
// the whole modal). Every modal has a Cancel button, and Escape still works.

// ---------- draggable modal ----------
// Drag by the title (h2) to reposition the modal anywhere on screen —
// handy when the content behind it (e.g. a Needs Review message) is
// useful to keep visible while the modal is open. Delegated on
// #modalBody since its inner h2 gets replaced every time a modal opens.
$('#modalBody').addEventListener('pointerdown', e => {
  const handle = e.target.closest('h2');
  if(!handle) return;
  const modal = $('#modalBody');
  const rect = modal.getBoundingClientRect();
  const offsetX = e.clientX - rect.left;
  const offsetY = e.clientY - rect.top;
  modal.style.position = 'fixed';
  modal.style.left = rect.left + 'px';
  modal.style.top = rect.top + 'px';
  modal.style.margin = '0';
  modal.setPointerCapture(e.pointerId);

  function onMove(ev){
    const maxLeft = window.innerWidth - modal.offsetWidth;
    const maxTop = window.innerHeight - modal.offsetHeight;
    modal.style.left = Math.min(Math.max(0, ev.clientX - offsetX), maxLeft) + 'px';
    modal.style.top = Math.min(Math.max(0, ev.clientY - offsetY), maxTop) + 'px';
  }
  function onUp(){
    modal.removeEventListener('pointermove', onMove);
    modal.removeEventListener('pointerup', onUp);
  }
  modal.addEventListener('pointermove', onMove);
  modal.addEventListener('pointerup', onUp);
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

function toast(msg, type){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');

// ---------- API ----------
async function apiGet(action){
  const res = await fetch(`${WEBAPP_URL}?action=${action}`);
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return json;
}
async function apiPost(action, payload){
  const res = await fetch(WEBAPP_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // avoids CORS preflight against Apps Script
    body: JSON.stringify({ action, ...payload })
  });
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return json;
}

function showLoading(isLoading){
  $('#loadingBar').classList.toggle('active', isLoading);
}
function copyMessage(btn){
  const text = btn.dataset.msg || '';
  const done = () => {
    const original = btn.innerHTML;
    btn.innerHTML = '✓';
    btn.style.color = 'var(--green)';
    btn.style.borderColor = 'var(--green)';
    btn.style.opacity = '1';
    setTimeout(()=>{ btn.innerHTML = original; btn.style.color=''; btn.style.borderColor=''; btn.style.opacity=''; }, 1000);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=> fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}
function manualRefresh(){
  const btn = $('#reloadBtn');
  btn.classList.add('spinning');
  setTimeout(()=> btn.classList.remove('spinning'), 600);
  refreshAll();
}

async function runBuilder(){
  if(!WEBAPP_URL) return;
  const btn = $('#runBuilderBtn');
  btn.disabled = true;
  btn.classList.add('spinning');
  showLoading(true);
  try{
    const result = await apiPost('runBuilder', {});
    const parts = [];
    if(result.added) parts.push(`${result.added} added`);
    if(result.closed) parts.push(`${result.closed} closed`);
    if(result.corrected) parts.push(`${result.corrected} corrected`);
    if(result.duplicatesSkipped) parts.push(`${result.duplicatesSkipped} duplicate${result.duplicatesSkipped===1?'':'s'} skipped`);
    if(result.staleOpenReplaced) parts.push(`${result.staleOpenReplaced} stale-open replaced`);
    if(result.flaggedForReview) parts.push(`${result.flaggedForReview} flagged for review`);
    const summary = parts.length ? parts.join(' · ') : (result.message || 'No new advisories to process.');
    toast(summary, 'success');
    await refreshAll();
  }catch(e){
    toast('Builder failed: ' + e.message, 'error');
  }finally{
    btn.disabled = false;
    btn.classList.remove('spinning');
    showLoading(false);
  }
}

async function refreshAll(){
  if(!WEBAPP_URL) return;
  showLoading(true);
  try{
    const [outages, plants, review, technology, derated] = await Promise.all([
      apiGet('getOutages'), apiGet('getPlants'), apiGet('getReview'), apiGet('getTechnology'), apiGet('getDeratedPlants')
    ]);
    // Data consistency safety net: any row that already has both Date Out
    // and Date In but is still marked Ongoing (e.g. edited directly in the
    // Sheet, not through this tool) gets silently corrected to Restored.
    const toFix = outages.filter(o => o.dateOut && o.dateIn && o.status === 'Ongoing');
    if(toFix.length){
      await Promise.all(toFix.map(o => apiPost('updateOutage', { row:o.row, data:{ status:'Restored' } })));
      toFix.forEach(o => { o.status = 'Restored'; });
    }
    dataCache = { outages, plants, review, technology, derated };
    technologyByUpper = {};
    Object.entries(technology || {}).forEach(([id, tech]) => { technologyByUpper[id.toUpperCase()] = tech; });
    setConnStatus('live');
    updateOutagesCountBubble();
    $('#countPlants').textContent = plants.length;
    $('#countReview').textContent = review.length;
    lastRefreshedAt = Date.now();
    updateLastRefreshedText();
    render();
  }catch(e){
    setConnStatus('error', e.message);
    toast('Could not load data: ' + e.message, 'error');
  }finally{
    showLoading(false);
  }
}

// ---------- pagination ----------
const PAGE_SIZE = 50;
let currentPage = { outages: 1, plants: 1, review: 1 };
function paginate(view, rows){
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if(currentPage[view] > totalPages) currentPage[view] = totalPages;
  if(currentPage[view] < 1) currentPage[view] = 1;
  const start = (currentPage[view]-1)*PAGE_SIZE;
  return { pageRows: rows.slice(start, start+PAGE_SIZE), totalPages, page: currentPage[view] };
}
function goToPage(view, page){
  currentPage[view] = page;
  render();
}
function paginationControls(view, page, totalPages){
  if(totalPages <= 1) return '';
  return `<div class="pagination">
    <button class="btn ghost" ${page<=1?'disabled':''} onclick="goToPage('${view}',${page-1})">‹ Prev</button>
    <span class="page-indicator">Page ${page} of ${totalPages}</span>
    <button class="btn ghost" ${page>=totalPages?'disabled':''} onclick="goToPage('${view}',${page+1})">Next ›</button>
  </div>`;
}

// ---------- sorting ----------
function compareValues(a, b, dir){
  const x = a==null ? '' : a, y = b==null ? '' : b;
  const numRe = /^-?\d+(\.\d+)?$/;
  let cmp;
  if(numRe.test(String(x).trim()) && numRe.test(String(y).trim())){
    cmp = parseFloat(x) - parseFloat(y);
  }else{
    cmp = String(x).localeCompare(String(y));
  }
  return dir === 'asc' ? cmp : -cmp;
}
function toggleSort(view, field){
  const s = sortState[view];
  if(s.field === field){
    s.dir = s.dir === 'asc' ? 'desc' : 'asc';
  }else{
    s.field = field;
    s.dir = ['date','dateOut','dateIn','timeMessage'].includes(field) ? 'desc' : 'asc';
  }
  currentPage[view] = 1;
  render();
}
function thSort(view, field, label){
  const s = sortState[view];
  const arrow = s.field === field ? ` <span class="sort-arrow">${s.dir==='asc'?'▲':'▼'}</span>` : '';
  return `<th class="sortable" onclick="toggleSort('${view}','${field}')">${label}${arrow}</th>`;
}

// ---------- CSV export ----------
function toCSVValue(v){
  v = v==null ? '' : String(v);
  if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function downloadCSV(filename, headers, rows){
  const lines = [headers.map(toCSVValue).join(',')].concat(rows.map(r=>r.map(toCSVValue).join(',')));
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Exported ' + filename, 'success');
}
function exportCSV(view){
  const stamp = new Date().toISOString().slice(0,10);
  if(view === 'outages'){
    const rows = getCurrentOutageRows();
    downloadCSV(`outages_${stamp}.csv`,
      ['Month','Date','Plant Alias','Resource ID','Technology','Outage Type','Category','Date Out','Date In','Status','SO Advisory'],
      rows.map(r=>[r.month,r.date,r.plantAlias,r.resourceId,r.technology,r.outageType,r.category,r.dateOut,r.dateIn,r.status,r.soAdvisory]));
  }else if(view === 'plants'){
    const rows = getCurrentPlantRows();
    downloadCSV(`plant_mapping_${stamp}.csv`,
      ['Alias','Resource ID','Capacity (MW)','Region'],
      rows.map(p=>[p.alias,p.resourceId,p.capacity,p.region]));
  }else if(view === 'review'){
    const rows = getCurrentReviewRows();
    downloadCSV(`needs_review_${stamp}.csv`,
      ['Time','Region','Message','Reason'],
      rows.map(r=>[r.timeMessage,r.region,r.message,r.reason]));
  }
}

let _resourceIdCopyRows = [];
function openResourceIdCopyModal(){
  const rows = getCurrentOutageRows(); // same search+filter+sort as what's on screen, full set (not paginated)

  // Collapse duplicate Resource IDs down to just the one with the latest
  // date — a resource can have many historical rows (repeated trips over
  // time), but this list should show each resource's current/most recent
  // outage type only, not every past occurrence.
  const latestByResourceId = new Map();
  rows.forEach(r => {
    const key = r.resourceId || '';
    if(!key) return;
    const rTime = new Date(r.dateOut || r.date || 0).getTime();
    const existing = latestByResourceId.get(key);
    if(!existing || rTime > existing._sortTime){
      latestByResourceId.set(key, { ...r, _sortTime: rTime });
    }
  });
  const dedupedRows = [...latestByResourceId.values()].sort((a,b) => b._sortTime - a._sortTime);

  _resourceIdCopyRows = dedupedRows.map(r => [r.resourceId || '', r.outageType || '']);
  const statusLabel = filterValue || 'All statuses';
  const dupeCount = rows.length - dedupedRows.length;
  $('#modalBody').innerHTML = `
    <h2>Resource ID &amp; Outage Type</h2>
    <div class="desc">${dedupedRows.length} unique Resource ID(s) — ${esc(statusLabel)}${searchTerm ? ' · search filter active' : ''}${dupeCount ? ` · ${dupeCount} duplicate row(s) collapsed to their latest occurrence` : ''}. Copy, then paste directly into Excel.</div>
    <div class="copy-table-wrap">
      <table class="copy-preview-table">
        <thead><tr><th>Resource_ID</th><th>Outage_Type</th></tr></thead>
        <tbody>${dedupedRows.map(r=>`<tr><td class="mono">${esc(r.resourceId)}</td><td>${esc(r.outageType)||'—'}</td></tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Close</button>
      <button class="btn primary" onclick="copyResourceIdTable(this)">Copy</button>
    </div>`;
  $('#overlay').classList.add('show');
}
function copyResourceIdTable(btn){
  const text = _resourceIdCopyRows.map(r => r.join('\t')).join('\n');
  const done = () => {
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(()=>{ btn.textContent = original; }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=> fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}
function getCurrentOutageRows(){
  let rows = dataCache.outages;
  if(searchTerm) rows = rows.filter(r => (r.plantAlias+r.resourceId+r.soAdvisory).toLowerCase().includes(searchTerm));
  if(filterValue) rows = rows.filter(r => filterValue === 'Restored' ? r.status.startsWith('Restored') : r.status === filterValue);
  const s = sortState.outages;
  if(s.field) rows = [...rows].sort((a,b)=> compareValues(a[s.field], b[s.field], s.dir));
  else rows = [...rows].sort((a,b)=> (b.dateOut||b.dateIn||'').localeCompare(a.dateOut||a.dateIn||''));

}
function updateOutagesCountBubble(){

function outageRow(r){
  const statusClass = r.status === 'Ongoing' ? 'ongoing' : 'restored';

  let ongoingDaysHtml = '';
  if(r.status === 'Ongoing' && r.dateOut){
    const days = Math.floor((Date.now() - new Date(r.dateOut).getTime()) / 86400000);
    if(days >= 0){
      const staleThreshold = 14;
      ongoingDaysHtml = `<span class="ongoing-days${days>=staleThreshold?' stale':''}" title="${days} day${days===1?'':'s'} since Date Out">${days}d</span>`;
    }
  }
  return `<tr>
    <td>${esc(r.month)}</td>
    <td>${fmt(r.date)}</td>
    <td class="editable" onclick="editCell(this,'outages',${r.row},'plantAlias','${esc(r.plantAlias)}')">${esc(r.plantAlias)}</td>

    <td class="mono editable" onclick="editDateCell(this,${r.row},'dateOut','${r.dateOut}')">${fmt(r.dateOut)}</td>
    <td class="mono editable" onclick="editDateCell(this,${r.row},'dateIn','${r.dateIn}')">${fmt(r.dateIn)}</td>
    <td class="editable" onclick="editStatusCell(this,${r.row},'${esc(r.status)}')"><span class="badge ${statusClass}">${r.status}</span>${ongoingDaysHtml}</td>

function editCell(el, view, row, field, current){
  el.innerHTML = `<input value="${esc(current)}" onblur="commitEdit(this,${row},'${field}')" onkeydown="if(event.key==='Enter')this.blur()">`;

function editStatusCell(el, row, current){
  el.innerHTML = `<select onblur="commitEdit(this,${row},'status')" onchange="this.blur()">
    ${['Ongoing','Restored','Restored (no prior OUT found)'].map(s=>`<option ${s===current?'selected':''}>${s}</option>`).join('')}
  </select>`;
  el.querySelector('select').focus();
}
async function commitEdit(input, row, field){
  const value = input.value;
  try{
    const payload = { [field]: value };
    // Data consistency check: if this edit results in both Date Out and
    // Date In being present while Status is still Ongoing, flip Status to
    // Restored too — an outage with both dates recorded isn't ongoing.
    const existing = dataCache.outages.find(o=>o.row===row) || {};
    const merged = { ...existing, ...payload };
    if(merged.dateOut && merged.dateIn && merged.status === 'Ongoing'){
      payload.status = 'Restored';
    }
    await apiPost('updateOutage', { row, data: payload });
    toast('Saved', 'success');
    await refreshAll();
  }catch(e){ toast('Save failed: ' + e.message, 'error'); }
}

  const resourceIds = [...new Set([...dataCache.plants.map(p=>p.resourceId), ...Object.keys(dataCache.technology||{})].filter(Boolean))].sort();

  $('#content').innerHTML = `<table>
    <thead><tr>${thSort('plants','alias','Alias (as in SO Advisory)')}${thSort('plants','resourceId','Resource ID')}${thSort('plants','capacity','Capacity (MW)')}${thSort('plants','region','Region')}</tr></thead>
    <tbody>${pageRows.map(p=>`<tr>
      <td class="editable" onclick="editPlantCell(this,${p.row},'alias','${esc(p.alias)}')">${esc(p.alias)}</td>
      <td class="mono editable" onclick="editPlantCell(this,${p.row},'resourceId','${esc(p.resourceId)}')">${esc(p.resourceId)}</td>
      <td class="mono editable" onclick="editPlantCell(this,${p.row},'capacity','${esc(p.capacity)}')">${p.capacity||'—'}</td>
      <td class="editable" onclick="editPlantCell(this,${p.row},'region','${esc(p.region)}')">${esc(p.region)||'—'}</td>
    </tr>`).join('')}</tbody>
  </table>
  <datalist id="plantEditResourceIdList">${resourceIds.map(id=>`<option value="${esc(id)}">`).join('')}</datalist>
  ${paginationControls('plants', page, totalPages)}`;
}
function editPlantCell(el, row, field, current){
  if(field === 'region'){
    el.innerHTML = `<select onblur="commitPlantEdit(this,${row},'region')" onchange="this.blur()">
      <option value="">Select region</option>
      ${['LUZON','VISAYAS','MINDANAO'].map(r=>`<option ${r===current?'selected':''}>${r}</option>`).join('')}
    </select>`;
    el.querySelector('select').focus();
    return;
  }
  const isResourceId = field === 'resourceId';
  const type = field === 'capacity' ? 'number' : 'text';
  const step = field === 'capacity' ? ' step="0.1"' : '';
  const listAttr = isResourceId ? ' list="plantEditResourceIdList"' : '';
  el.innerHTML = `<input class="${isResourceId?'mono':''}" type="${type}"${step}${listAttr} value="${esc(current)}" onblur="commitPlantEdit(this,${row},'${field}')" onkeydown="if(event.key==='Enter')this.blur()">`;
  el.querySelector('input').focus();
}
async function commitPlantEdit(input, row, field){
  const value = input.value;
  try{
    await apiPost('updatePlant', { row, data:{ [field]: value } });
    toast('Saved', 'success');
    await refreshAll();
  }catch(e){ toast('Save failed: ' + e.message, 'error'); }
}
function openAddPlant(){
  const resourceIds = [...new Set([...dataCache.plants.map(p=>p.resourceId), ...Object.keys(dataCache.technology||{})].filter(Boolean))].sort();
  plantRegionAutoLock = false;
  plantCapacityAutoLock = false;
  $('#modalBody').innerHTML = `
    <h2>Add plant to mapping</h2>
    <div class="desc">Adds a new alias so future advisories mentioning this plant resolve automatically.</div>
    <div class="field"><label>Alias (exact text as it appears in SO_Advisories)</label><input id="p_alias" placeholder="e.g. CALACA 1"></div>
    <div class="field"><label>Resource ID</label>
      <input id="p_resourceId" class="mono" list="p_resourceId_list" placeholder="Pick existing or type a new one" autocomplete="off" oninput="autofillPlantFields(this.value)">
      <datalist id="p_resourceId_list">${resourceIds.map(id=>`<option value="${esc(id)}">`).join('')}</datalist>
    </div>
    <div class="row2">
      <div class="field"><label>Capacity (MW)</label><input id="p_capacity" type="number" step="0.1" oninput="plantCapacityAutoLock=true"></div>
      <div class="field"><label>Region</label>
        <select id="p_region" onchange="plantRegionAutoLock=true">
          <option value="">Select region</option>
          <option value="LUZON">LUZON</option>
          <option value="VISAYAS">VISAYAS</option>
          <option value="MINDANAO">MINDANAO</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="submitPlant()">Add plant</button>
    </div>`;
  $('#overlay').classList.add('show');
}
let plantRegionAutoLock = false;
let plantCapacityAutoLock = false;
function autofillPlantFields(val){
  const trimmed = val.trim();
  const exact = dataCache.plants.find(p => (p.resourceId||'').toUpperCase() === trimmed.toUpperCase());
  if(exact){
    if(!plantRegionAutoLock && exact.region) $('#p_region').value = exact.region;
    if(!plantCapacityAutoLock && exact.capacity !== '' && exact.capacity != null) $('#p_capacity').value = exact.capacity;
    return;
  }
  if(plantRegionAutoLock) return;
  const m = trimmed.match(/^(\d{1,2})/);
  if(!m) return;
  const n = parseInt(m[1], 10);
  let region = '';
  if(n >= 1 && n <= 3) region = 'LUZON';
  else if(n >= 4 && n <= 8) region = 'VISAYAS';
  else if(n >= 9) region = 'MINDANAO';
  if(region) $('#p_region').value = region;
}
async function submitPlant(){
  const data = {
    alias:$('#p_alias').value.trim(), resourceId:$('#p_resourceId').value.trim(),
    capacity:$('#p_capacity').value, region:$('#p_region').value.trim()
  };
  if(!data.alias || !data.resourceId){ toast('Alias and Resource ID are required', 'error'); return; }
  try{
    await apiPost('addPlant', { data });
    closeModal();
    toast('Plant added', 'success');
    await refreshAll();
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
}

// ================= NEEDS REVIEW =================
function getCurrentReviewRows(){
  let rows = dataCache.review;
  if(searchTerm) rows = rows.filter(r => r.message.toLowerCase().includes(searchTerm));
  if(filterValue==='Ambiguous') rows = rows.filter(r => r.reason.startsWith('Ambiguous'));
  if(filterValue==='missing') rows = rows.filter(r => r.reason.includes('missing'));
  const s = sortState.review;
  const sortFn = s.field
    ? (a,b)=> compareValues(a[s.field], b[s.field], s.dir)
    : (a,b)=> compareValues(a.timeMessage, b.timeMessage, 'asc');
  return [...rows].sort(sortFn);
}
function renderReview(){
  $('#viewTitle').textContent = 'Needs Review';
  $('#filterSelect').innerHTML = `<option value="">All reasons</option><option value="Ambiguous">Ambiguous alias</option><option value="missing">Possibly missing plant</option>`;
  $('#filterSelect').value = filterValue;

  let rows = getCurrentReviewRows();
  const isFiltered = !!(searchTerm || filterValue);
  $('#viewMeta').textContent = isFiltered
    ? `${rows.length} of ${dataCache.review.length} advisories awaiting resolution`
    : `${dataCache.review.length} advisories awaiting resolution`;
  $('#viewActions').innerHTML = `<button class="btn ghost" onclick="exportCSV('review')">Export CSV</button><button class="btn primary" onclick="openAddPlant()">Add Plant Mapping</button><button class="btn primary" onclick="openAddOutage()">Add record</button>`;
  $('#toolbar').style.display='flex';

  if(!rows.length){ $('#content').innerHTML = emptyState('Nothing needs review right now.'); return; }

  $('#content').innerHTML = `<table>
    <thead><tr>${thSort('review','timeMessage','Time')}${thSort('review','region','Region')}<th>Message</th><th></th>${thSort('review','reason','Reason')}<th></th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td class="mono">${fmt(r.timeMessage)}</td>
      <td>${esc(r.region)}</td>
      <td class="msg-cell">${esc(r.message)}</td>
      <td><button class="copy-btn" title="Copy message" data-msg="${esc(r.message)}" onclick="copyMessage(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </button></td>
      <td class="msg-cell"><span class="badge review">flagged</span> ${esc(r.reason)}</td>
      <td><button class="btn ghost" onclick="openResolve(${r.row})">Resolve</button></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

// ================= DERATED PLANTS =================
function renderDerated(){
  $('#viewTitle').textContent = 'Derated Plants';
  $('#toolbar').style.display = 'none';

  const derated = dataCache.derated;
  $('#viewMeta').textContent = derated ? `Data anchored to ${derated.anchorDate}` : '';
  $('#viewActions').innerHTML = `
    <label class="derated-date-label">
      Date
      <span class="date-input-wrap">
        <input type="date" id="deratedDatePicker" value="${derated ? esc(derated.anchorDate) : ''}" onchange="changeDeratedDate(this.value)">
        <svg class="date-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </span>
    </label>`;

  if(!derated){ $('#content').innerHTML = emptyState('No data loaded yet.'); return; }

  const regions = [
    { key:'luzon',    label:'LUZON',    rows: derated.luzon },
    { key:'visayas',  label:'VISAYAS',  rows: derated.visayas },
    { key:'mindanao', label:'MINDANAO', rows: derated.mindanao }
  ];

  $('#content').innerHTML = `<div class="derated-wrap">${regions.map(region => `
    <div class="derated-section">
      <div class="derated-section-header">
        <h3>${region.label}</h3>
        <button class="copy-btn-text" onclick="copyDeratedRegion(this,'${region.key}')">Copy</button>
      </div>
      <table class="derated-table">
        <thead><tr><th>Time</th><th>Advisory</th></tr></thead>
        <tbody>${region.rows.map(r=>`<tr><td class="mono">${esc(r.time)}</td><td>${esc(r.advisory)||'—'}</td></tr>`).join('')}</tbody>
      </table>
    </div>`).join('')}</div>`;
}

async function changeDeratedDate(newDateStr){
  if(!newDateStr || !WEBAPP_URL) return;
  showLoading(true);
  try{
    dataCache.derated = await apiPost('setDeratedDate', { date: newDateStr });
    toast('Date updated', 'success');
    render();
  }catch(e){
    toast('Failed to update date: ' + e.message, 'error');
  }finally{
    showLoading(false);
  }
}

function copyDeratedRegion(btn, key){
  const rows = (dataCache.derated && dataCache.derated[key]) || [];
  const text = rows.map(r => r.advisory || '').join('\n');
  const done = () => {
    const original = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(()=>{ btn.textContent = original; }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=> fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}
function openResolve(row){
  const item = dataCache.review.find(r=>r.row===row);
  resolveTechnologyAutoLock = false;
  resolveRegionAutoLock = false;
  resolveCapacityAutoLock = false;
  const resourceIds = [...new Set([...dataCache.plants.map(p=>p.resourceId), ...Object.keys(dataCache.technology||{})].filter(Boolean))].sort();
  $('#modalBody').innerHTML = `
    <h2>Resolve to outage record</h2>
    <div class="desc">This creates a new row in Outage Database and removes the item from Needs Review.</div>
    <div class="quote-box">${esc(item.message)}</div>
    <div class="row2">
      <div class="field"><label>Plant alias</label><input id="r_plantAlias"></div>
      <div class="field"><label>Resource ID</label>
        <input id="r_resourceId" class="mono" list="r_resourceId_list" autocomplete="off" oninput="autofillResolveTechnology(this.value)">
        <datalist id="r_resourceId_list">${resourceIds.map(id=>`<option value="${esc(id)}">`).join('')}</datalist>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>Technology</label><input id="r_technology" oninput="resolveTechnologyAutoLock=true"></div>
      <div class="field"><label>Outage type</label>
        <select id="r_outageType"><option>Unplanned</option><option>Planned</option></select>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>Date out</label><input type="datetime-local" lang="en-GB" id="r_dateOut"></div>
      <div class="field"><label>Date in</label><input type="datetime-local" lang="en-GB" id="r_dateIn"></div>
    </div>
    <div class="checkbox-field">
      <input type="checkbox" id="r_addToMapping" checked onchange="toggleResolveMappingFields()">
      <label for="r_addToMapping">Also add this alias to Plant Mapping</label>
    </div>
    <div class="row2" id="r_mappingFields">
      <div class="field"><label>Capacity (MW)</label><input id="r_capacity" type="number" step="0.1" oninput="resolveCapacityAutoLock=true"></div>
      <div class="field"><label>Region</label>
        <select id="r_region" onchange="resolveRegionAutoLock=true">
          <option value="">Select region</option>
          <option value="LUZON">LUZON</option>
          <option value="VISAYAS">VISAYAS</option>
          <option value="MINDANAO">MINDANAO</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="submitResolve(${row})">Resolve</button>
    </div>`;
  $('#overlay').classList.add('show');
}
function toggleResolveMappingFields(){
  $('#r_mappingFields').style.display = $('#r_addToMapping').checked ? 'grid' : 'none';
}
let resolveTechnologyAutoLock = false;
let resolveRegionAutoLock = false;
let resolveCapacityAutoLock = false;
function autofillResolveTechnology(val){
  const trimmed = val.trim();
  if(!resolveTechnologyAutoLock){
    const tech = technologyByUpper[trimmed.toUpperCase()];
    if(tech) $('#r_technology').value = tech;
  }
  const exact = dataCache.plants.find(p => (p.resourceId||'').toUpperCase() === trimmed.toUpperCase());
  if(!resolveRegionAutoLock){
    if(exact && exact.region){
      $('#r_region').value = exact.region;
    }else{
      const m = trimmed.match(/^(\d{1,2})/);
      if(m){
        const n = parseInt(m[1], 10);
        let region = '';
        if(n >= 1 && n <= 3) region = 'LUZON';
        else if(n >= 4 && n <= 8) region = 'VISAYAS';
        else if(n >= 9) region = 'MINDANAO';
        if(region) $('#r_region').value = region;
      }
    }
  }
  if(!resolveCapacityAutoLock && exact && exact.capacity !== '' && exact.capacity != null){
    $('#r_capacity').value = exact.capacity;
  }
}
async function submitResolve(row){
  const item = dataCache.review.find(r=>r.row===row);
  const data = {
    plantAlias:$('#r_plantAlias').value, resourceId:$('#r_resourceId').value,
    technology:$('#r_technology').value, outageType:$('#r_outageType').value,
    dateOut:$('#r_dateOut').value, dateIn:$('#r_dateIn').value,
    status: $('#r_dateIn').value ? 'Restored' : 'Ongoing',
    soAdvisory:item.message
  };
  if(!data.plantAlias || !data.resourceId){ toast('Plant alias and Resource ID are required', 'error'); return; }
  try{
    // If this is a pure restoration (Date In filled, no Date Out) and this
    // Resource ID has any open Ongoing rows, close ALL of them instead of
    // creating a brand-new orphaned "Restored" record with no Date Out —
    // mirroring the automated builder's restoration logic: a resource
    // can't really have multiple concurrent outages, so any other Ongoing
    // rows are stale duplicates that close alongside this one, all with
    // the same restoration Date In. Already-Restored rows are untouched;
    // this only ever looks at rows with status === 'Ongoing'.
    const openMatches = !data.dateOut && data.dateIn
      ? dataCache.outages.filter(o => o.resourceId === data.resourceId && o.status === 'Ongoing')
      : [];

    if(openMatches.length){
      await Promise.all(openMatches.map(o =>
        apiPost('updateOutage', { row: o.row, data: { dateIn: data.dateIn, status: 'Restored' } })
      ));
      await apiPost('deleteReview', { reviewRow: row });
    }else{
      await apiPost('resolveReview', { reviewRow: row, data });
    }
    if($('#r_addToMapping').checked){
      const aliasNorm = data.plantAlias.trim().toLowerCase();
      const alreadyMapped = dataCache.plants.some(p => (p.alias||'').trim().toLowerCase() === aliasNorm);
      if(!alreadyMapped){
        await apiPost('addPlant', { data: {
          alias: data.plantAlias, resourceId: data.resourceId,
          capacity: $('#r_capacity').value, region: $('#r_region').value
        }});
      }
    }
    closeModal();
    toast(openMatches.length
      ? `Closed ${openMatches.length} Ongoing outage${openMatches.length===1?'':'s'}`
      : 'Resolved and added to Outage Database', 'success');
    await refreshAll();
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
}

// ---------- helpers ----------
function emptyState(msg){ return `<div class="empty"><div class="big">${msg}</div></div>`; }
function esc(v){ return (v==null?'':String(v)).replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }
function fmt(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
}

function updateLastRefreshedText(){
  const el = $('#lastRefreshedText');
  if(!el) return;
  if(!lastRefreshedAt){ el.textContent = ''; return; }
  const secs = Math.floor((Date.now() - lastRefreshedAt) / 1000);
  let label;
  if(secs < 10) label = 'just now';
  else if(secs < 60) label = `${secs}s ago`;
  else if(secs < 3600) label = `${Math.floor(secs/60)}m ago`;
  else label = `${Math.floor(secs/3600)}h ago`;
  el.textContent = `· Updated ${label}`;
}
setInterval(updateLastRefreshedText, 15000);

loadSettings();
</script>
